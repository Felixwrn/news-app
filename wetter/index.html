<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WRN Weather</title>

<style>

body{
    margin:0;
    background:#000;
    color:white;
    font-family:Arial,sans-serif;
}

.wrapper{
    padding:40px;
    max-width:1200px;
    margin:auto;
}

/* HEADER */

.logo{
    color:#7c3aed;
    font-size:48px;
    font-weight:bold;
    margin-bottom:10px;
}

.location{
    color:#777;
    margin-bottom:40px;
    font-size:20px;
}

/* CURRENT WEATHER */

.current{

    background:#0a0a0a;

    border:1px solid #1f1f1f;

    border-radius:36px;

    padding:40px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    box-shadow:
    0 0 40px rgba(124,58,237,0.15);
}

.left{
    display:flex;
    align-items:center;
    gap:25px;
}

.icon{
    font-size:90px;
}

.temp{
    font-size:88px;
    font-weight:bold;
}

.desc{
    color:#aaa;
    font-size:24px;
}

/* INFO */

.info{
    display:flex;
    gap:20px;
    margin-top:30px;
}

.box{
    flex:1;

    background:#111;

    border:1px solid #222;

    border-radius:24px;

    padding:25px;
}

.label{
    color:#777;
    margin-bottom:10px;
}

.value{
    font-size:32px;
    font-weight:bold;
}

/* FORECAST */

.forecast-title{
    margin-top:50px;
    margin-bottom:20px;

    font-size:36px;
}

.forecast{

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(140px,1fr));

    gap:20px;
}

.day{

    background:#111;

    border:1px solid #222;

    border-radius:28px;

    padding:25px;

    text-align:center;

    transition:0.3s;
}

.day:hover{
    border-color:#7c3aed;
    transform:translateY(-4px);
}

.day-name{
    color:#888;
    margin-bottom:15px;
}

.day-icon{
    font-size:48px;
    margin-bottom:15px;
}

.day-temp{
    font-size:30px;
    font-weight:bold;
}

/* FOOTER */

.footer{
    margin-top:50px;
    color:#666;
    text-align:center;
}

</style>
</head>

<body>

<div class="wrapper">

    <div class="logo">
        WRN Weather
    </div>

    <div class="location" id="location">
        Standort wird geladen...
    </div>

    <!-- CURRENT -->

    <div class="current">

        <div class="left">

            <div class="icon" id="icon">
                ☀️
            </div>

            <div>

                <div class="temp" id="temp">
                    --
                </div>

            </div>

        </div>

    </div>

    <!-- INFO -->

    <div class="info">

        <div class="box">

            <div class="label">
                Wind
            </div>

            <div class="value" id="wind">
                --
            </div>

        </div>

        <div class="box">

            <div class="label">
                Luftdruck
            </div>

            <div class="value" id="pressure">
                --
            </div>

        </div>

    </div>

    <!-- FORECAST -->

    <div class="forecast-title">
        7 Tage Trend
    </div>

    <div class="forecast" id="forecast"></div>

    <div class="footer">
        Wetterdaten vom DWD
    </div>

</div>

<script>

/* Wetter Icons */

function getWeatherIcon(condition){

    if(!condition)
        return "☁️";

    const c =
    condition.toLowerCase();

    if(
        c.includes("rain") ||
        c.includes("drizzle")
    ){
        return "🌧️";
    }

    if(
        c.includes("cloud") ||
        c.includes("overcast")
    ){
        return "☁️";
    }

    if(
        c.includes("clear") ||
        c.includes("dry") ||
        c.includes("sun")
    ){
        return "☀️";
    }

    if(
        c.includes("partly")
    ){
        return "🌤️";
    }

    if(
        c.includes("snow")
    ){
        return "❄️";
    }

    if(
        c.includes("fog") ||
        c.includes("mist")
    ){
        return "🌫️";
    }

    if(
        c.includes("storm") ||
        c.includes("thunder")
    ){
        return "⛈️";
    }

    return "🌤️";
}

/* ORT LADEN */

async function loadLocation(lat, lon){

    try{

        const response =
        await fetch(
            `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`
        );

        const data =
        await response.json();

        const city =
            data.address.city ||
            data.address.town ||
            data.address.village ||
            "Unbekannter Ort";

        document
        .getElementById("location")
        .innerText =
        `📍 ${city}`;

    }catch(error){

        console.error(error);

        document
        .getElementById("location")
        .innerText =
        "📍 Standort unbekannt";

    }

}

/* WETTER LADEN */

async function loadWeather(lat,lon){

    try{

        /* CURRENT WEATHER */

        const currentApi =
        `https://api.brightsky.dev/current_weather?lat=${lat}&lon=${lon}`;

        const currentResponse =
        await fetch(currentApi);

        const currentData =
        await currentResponse.json();

        const weather =
        currentData.weather;

        document
        .getElementById("temp")
        .innerText =
        `${Math.round(weather.temperature)}°`;

        document
        .getElementById("icon")
        .innerText =
        getWeatherIcon(weather.condition);

        document
        .getElementById("wind")
        .innerText =
        `${weather.wind_speed} km/h`;

        document
        .getElementById("pressure")
        .innerText =
        `${weather.pressure_msl} hPa`;

        /* FORECAST */

        const forecastApi =
        `https://api.brightsky.dev/weather?lat=${lat}&lon=${lon}`;

        const forecastResponse =
        await fetch(forecastApi);

        const forecastData =
        await forecastResponse.json();

        const forecast =
        document.getElementById("forecast");

        forecast.innerHTML = "";

        const dailyData = {};

        forecastData.weather.forEach(entry => {

            const date =
            new Date(entry.timestamp);

            const dayKey =
            date.toLocaleDateString("de-DE");

            /*
            Mittagswerte nutzen
            */

            const hour =
            date.getHours();

            if(hour < 11 || hour > 15)
                return;

            if(!dailyData[dayKey]){

                dailyData[dayKey] = entry;

            }

        });

        Object.values(dailyData)
        .slice(0,7)
        .forEach(day => {

            const date =
            new Date(day.timestamp);

            const dayName =
            date.toLocaleDateString(
                "de-DE",
                { weekday:"short" }
            );

            const temp =
            day.temperature != null
            ? Math.round(day.temperature) + "°"
            : "--";

            const card =
            document.createElement("div");

            card.className =
            "day";

            card.innerHTML = `

                <div class="day-name">
                    ${dayName}
                </div>

                <div class="day-icon">
                    ${getWeatherIcon(day.condition)}
                </div>

                <div class="day-temp">
                    ${temp}
                </div>

            `;

            forecast.appendChild(card);

        });

    }catch(error){

        console.error(error);

        document
        .getElementById("forecast")
        .innerHTML =
        "Forecast konnte nicht geladen werden.";

    }

}

/* GEOLOCATION */

if(navigator.geolocation){

    navigator.geolocation.getCurrentPosition(

        position => {

            const lat =
            position.coords.latitude;

            const lon =
            position.coords.longitude;

            loadLocation(lat, lon);

            loadWeather(lat, lon);

        },

        error => {

            console.error(error);

            document
            .getElementById("location")
            .innerText =
            "Standort verweigert";

        }

    );

}

</script>

</body>
</html>
