<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WRN Weather</title>

<style>

body{
    margin:0;
    background:#000;
    color:white;
    font-family:Arial,sans-serif;
}

.wrapper{
    padding:40px;
    max-width:1200px;
    margin:auto;
}

.logo{
    color:#7c3aed;
    font-size:48px;
    font-weight:bold;
    margin-bottom:10px;
}

.location{
    color:#777;
    margin-bottom:25px;
    font-size:20px;
}

/* WARNING */

.warning{

    margin-bottom:35px;

    background:
    linear-gradient(
        90deg,
        #ff3b30,
        #ff9500
    );

    color:white;

    padding:18px 24px;

    border-radius:24px;

    font-size:20px;

    font-weight:bold;

    box-shadow:
    0 0 30px rgba(255,80,0,0.35);

    animation:
    pulse 2s infinite;
}

@keyframes pulse{

    0%{
        opacity:1;
    }

    50%{
        opacity:0.85;
    }

    100%{
        opacity:1;
    }

}

/* CURRENT */

.current{

    background:#0a0a0a;

    border:1px solid #1f1f1f;

    border-radius:36px;

    padding:40px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    box-shadow:
    0 0 40px rgba(124,58,237,0.15);
}

.left{
    display:flex;
    align-items:center;
    gap:25px;
}

.icon{
    font-size:90px;
}

.temp{
    font-size:88px;
    font-weight:bold;
}

/* TITLES */

.forecast-title{
    margin-top:50px;
    margin-bottom:20px;
    font-size:36px;
}

/* HOURLY */

.hourly{

    display:flex;

    gap:20px;

    overflow-x:auto;

    padding-bottom:10px;

    margin-top:20px;
}

.hour-card{

    min-width:120px;

    background:#111;

    border:1px solid #222;

    border-radius:24px;

    padding:20px;

    text-align:center;

    transition:0.3s;
}

.hour-card:hover{

    border-color:#7c3aed;

    transform:translateY(-4px);
}

.hour-time{

    color:#888;

    margin-bottom:12px;
}

.hour-icon{

    font-size:38px;

    margin-bottom:12px;
}

.hour-temp{

    font-size:28px;

    font-weight:bold;
}

/* INFO */

.info{
    display:flex;
    gap:20px;
    margin-top:40px;
}

.box{
    flex:1;

    background:#111;

    border:1px solid #222;

    border-radius:24px;

    padding:25px;
}

.label{
    color:#777;
    margin-bottom:10px;
}

.value{
    font-size:32px;
    font-weight:bold;
}

/* SUN INFO */

.sun-info{

    display:flex;

    gap:20px;

    margin-top:40px;

    flex-wrap:wrap;
}

.sun-card{

    flex:1;

    min-width:220px;

    background:#111;

    border:1px solid #222;

    border-radius:24px;

    padding:20px;
}

.sun-label{

    color:#777;

    margin-bottom:10px;
}

.sun-value{

    font-size:24px;

    font-weight:bold;
}

/* UV */

.uv-box{

    margin-top:40px;

    background:#111;

    border:1px solid #222;

    border-radius:24px;

    padding:25px;
}

.uv-label{

    color:#777;

    margin-bottom:10px;
}

.uv-value{

    font-size:34px;

    font-weight:bold;
}

/* FORECAST */

.forecast{

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(140px,1fr));

    gap:20px;
}

.day{

    background:#111;

    border:1px solid #222;

    border-radius:28px;

    padding:25px;

    text-align:center;

    transition:0.3s;
}

.day:hover{

    border-color:#7c3aed;

    transform:translateY(-4px);
}

.day-name{

    color:#888;

    margin-bottom:15px;
}

.day-icon{

    font-size:48px;

    margin-bottom:15px;
}

.day-temp{

    font-size:30px;

    font-weight:bold;
}

.footer{

    margin-top:50px;

    color:#666;

    text-align:center;
}

</style>
</head>

<body>

<div class="wrapper">

    <div class="logo">
        WRN Weather
    </div>

    <div class="location" id="location">
        Standort wird geladen...
    </div>

    <div class="warning" id="warningBanner">
        Lade Wetterwarnungen...
    </div>

    <div class="current">

        <div class="left">

            <div class="icon" id="icon">
                ☀️
            </div>

            <div>

                <div class="temp" id="temp">
                    --
                </div>

            </div>

        </div>

    </div>

    <div class="forecast-title">
        24 Stunden Trend
    </div>

    <div class="hourly" id="hourly"></div>

    <div class="info">

        <div class="box">

            <div class="label">
                Wind
            </div>

            <div class="value" id="wind">
                --
            </div>

        </div>

        <div class="box">

            <div class="label">
                Luftdruck
            </div>

            <div class="value" id="pressure">
                --
            </div>

        </div>

    </div>

    <div class="sun-info">

        <div class="sun-card">

            <div class="sun-label">
                🌅 Sonnenaufgang
            </div>

            <div class="sun-value" id="sunrise">
                --
            </div>

        </div>

        <div class="sun-card">

            <div class="sun-label">
                🌇 Sonnenuntergang
            </div>

            <div class="sun-value" id="sunset">
                --
            </div>

        </div>

    </div>

    <div class="uv-box">

        <div class="uv-label">
            ☀️ UV Index
        </div>

        <div class="uv-value" id="uvIndex">
            --
        </div>

    </div>

    <div class="forecast-title">
        7 Tage Trend
    </div>

    <div class="forecast" id="forecast"></div>

    <div class="footer">
        Wetterdaten von Open-Meteo
    </div>

</div>

<script>

/* ICONS */

function getWeatherIcon(code){

    if(code === 0)
        return "☀️";

    if(code <= 3)
        return "🌤️";

    if(code <= 48)
        return "☁️";

    if(code <= 67)
        return "🌧️";

    if(code <= 77)
        return "❄️";

    if(code <= 82)
        return "🌧️";

    if(code <= 99)
        return "⛈️";

    return "☁️";
}

/* LOCATION */

async function loadLocation(lat, lon){

    try{

        const response =
        await fetch(
            `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`
        );

        const data =
        await response.json();

        const city =
            data.address.city ||
            data.address.town ||
            data.address.village ||
            "Unbekannter Ort";

        document
        .getElementById("location")
        .innerText =
        `📍 ${city}`;

    }catch(error){

        console.error(error);
    }
}

/* WARNINGS */

async function loadWarnings(lat, lon){

    try{

        const api =
        `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=weather_code&timezone=auto`;

        const response =
        await fetch(api);

        const data =
        await response.json();

        const banner =
        document.getElementById("warningBanner");

        const code =
        data.daily.weather_code[0];

        let text =
        "✅ Keine Wetterwarnungen";

        let bg =
        "#1f1f1f";

        if(code >= 95){

            text =
            "⛈ Gewitterwarnung aktiv";

            bg =
            "linear-gradient(90deg,#ff3b30,#ff9500)";
        }

        else if(code >= 61 && code <= 67){

            text =
            "🌧 Starkregen möglich";

            bg =
            "linear-gradient(90deg,#2563eb,#7c3aed)";
        }

        else if(code >= 71 && code <= 77){

            text =
            "❄️ Schneewarnung aktiv";

            bg =
            "linear-gradient(90deg,#60a5fa,#94a3b8)";
        }

        else if(code >= 45 && code <= 48){

            text =
            "🌫 Nebelwarnung";

            bg =
            "linear-gradient(90deg,#6b7280,#9ca3af)";
        }

        banner.innerText =
        text;

        banner.style.background =
        bg;

    }catch(error){

        console.error(error);
    }
}

/* WEATHER */

async function loadWeather(lat, lon){

    try{

        const api =
        `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,wind_speed_10m,surface_pressure,weather_code,uv_index&hourly=temperature_2m,weather_code&daily=temperature_2m_max,weather_code,sunrise,sunset&timezone=auto`;

        const response =
        await fetch(api);

        const data =
        await response.json();

        document
        .getElementById("temp")
        .innerText =
        `${Math.round(data.current.temperature_2m)}°`;

        document
        .getElementById("icon")
        .innerText =
        getWeatherIcon(data.current.weather_code);

        document
        .getElementById("wind")
        .innerText =
        `${Math.round(data.current.wind_speed_10m)} km/h`;

        document
        .getElementById("pressure")
        .innerText =
        `${Math.round(data.current.surface_pressure)} hPa`;

        const sunrise =
        new Date(data.daily.sunrise[0]);

        const sunset =
        new Date(data.daily.sunset[0]);

        document
        .getElementById("sunrise")
        .innerText =
        sunrise.toLocaleTimeString(
            "de-DE",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

        document
        .getElementById("sunset")
        .innerText =
        sunset.toLocaleTimeString(
            "de-DE",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

        const uv =
        Math.round(
            data.current.uv_index
        );

        let uvText =
        `${uv}`;

        if(uv <= 2)
            uvText += " • Niedrig";

        else if(uv <= 5)
            uvText += " • Mittel";

        else if(uv <= 7)
            uvText += " • Hoch";

        else if(uv <= 10)
            uvText += " • Sehr hoch";

        else
            uvText += " • Extrem";

        document
        .getElementById("uvIndex")
        .innerText =
        uvText;

        /* HOURLY */

        const hourly =
        document.getElementById("hourly");

        hourly.innerHTML = "";

        for(let i = 0; i < 24; i++){

            const time =
            new Date(data.hourly.time[i]);

            const hour =
            time.toLocaleTimeString(
                "de-DE",
                {
                    hour:"2-digit",
                    minute:"2-digit"
                }
            );

            const temp =
            Math.round(
                data.hourly.temperature_2m[i]
            );

            const code =
            data.hourly.weather_code[i];

            const card =
            document.createElement("div");

            card.className =
            "hour-card";

            card.innerHTML = `

                <div class="hour-time">
                    ${hour}
                </div>

                <div class="hour-icon">
                    ${getWeatherIcon(code)}
                </div>

                <div class="hour-temp">
                    ${temp}°
                </div>

            `;

            hourly.appendChild(card);
        }

        /* FORECAST */

        const forecast =
        document.getElementById("forecast");

        forecast.innerHTML = "";

        data.daily.time.forEach((day,index) => {

            const date =
            new Date(day);

            const dayName =
            date.toLocaleDateString(
                "de-DE",
                {
                    weekday:"short"
                }
            );

            const temp =
            Math.round(
                data.daily.temperature_2m_max[index]
            );

            const code =
            data.daily.weather_code[index];

            const card =
            document.createElement("div");

            card.className =
            "day";

            card.innerHTML = `

                <div class="day-name">
                    ${dayName}
                </div>

                <div class="day-icon">
                    ${getWeatherIcon(code)}
                </div>

                <div class="day-temp">
                    ${temp}°
                </div>

            `;

            forecast.appendChild(card);
        });

    }catch(error){

        console.error(error);
    }
}

/* START */

function startWeather(lat, lon){

    loadLocation(lat, lon);

    loadWeather(lat, lon);

    loadWarnings(lat, lon);
}

/* ANDROID APP */

if(window.Android){

    try{

        const lat =
        Android.getLatitude();

        const lon =
        Android.getLongitude();

        if(lat && lon){

            startWeather(lat, lon);

        }else{

            throw new Error(
                "Keine Android Koordinaten"
            );
        }

    }catch(error){

        console.error(error);
    }
}

/* BROWSER */

else if(navigator.geolocation){

    navigator.geolocation.getCurrentPosition(

        position => {

            const lat =
            position.coords.latitude;

            const lon =
            position.coords.longitude;

            startWeather(lat, lon);

        },

        error => {

            console.error(error);

            document
            .getElementById("location")
            .innerText =
            "Standort verweigert";

        }

    );
}

</script>
