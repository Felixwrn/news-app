<script>

const ring = {
    lat:50.3351,
    lon:6.9474
};

const map = new maplibregl.Map({

    container:"map",

    style:{
        version:8,

        sources:{
            osm:{
                type:"raster",

                tiles:[
                    "https://a.tile.openstreetmap.org/{z}/{x}/{y}.png",
                    "https://b.tile.openstreetmap.org/{z}/{x}/{y}.png",
                    "https://c.tile.openstreetmap.org/{z}/{x}/{y}.png"
                ],

                tileSize:256,

                attribution:"© OpenStreetMap"
            }
        },

        layers:[
            {
                id:"osm",
                type:"raster",
                source:"osm"
            }
        ]
    },

    center:[ring.lon, ring.lat],

    zoom:4,

    maxZoom:5,

    minZoom:3
});

const popup = new maplibregl.Popup({
    offset:25
})
.setHTML(`

    <div style="font-size:16px;font-weight:bold;">
        🏁 Nürburgring Boxengasse
    </div>

    <div style="margin-top:8px;color:#aaa;">
        WRN Racing Radar Standort
    </div>

`);

const marker = new maplibregl.Marker({
    color:"#7c3aed"
})
.setLngLat([
    ring.lon,
    ring.lat
])
.setPopup(popup)
.addTo(map);

marker.getElement().addEventListener("mouseenter", () => {

    popup.addTo(map);
});

marker.getElement().addEventListener("mouseleave", () => {

    popup.remove();
});

let radarFrames = [];
let currentFrame = 0;
let radarLayerId = "radar-layer";

async function loadRadar(){

    try{

        const response =
        await fetch(
            "https://api.rainviewer.com/public/weather-maps.json"
        );

        const data =
        await response.json();

        radarFrames = [

            ...data.radar.past,

            ...(data.radar.nowcast || [])

        ];

        /* 3 STUNDEN FAKE FUTURE */

        const lastFrame =
        radarFrames[
            radarFrames.length - 1
        ];

        for(let i = 1; i <= 36; i++){

            radarFrames.push({

                path:lastFrame.path,

                time:lastFrame.time + (i * 300),

                fake:true,

                moveX:i * 0.15,
                moveY:i * -0.08
            });
        }

        const slider =
        document.getElementById("timelineSlider");

        slider.max =
        radarFrames.length - 1;

        const now =
        Date.now() / 1000;

        let closestIndex = 0;

        let smallestDiff =
        Infinity;

        radarFrames.forEach((frame, index) => {

            const diff =
            Math.abs(frame.time - now);

            if(diff < smallestDiff){

                smallestDiff = diff;

                closestIndex = index;
            }
        });

        currentFrame =
        Math.max(
            closestIndex - 2,
            0
        );

        slider.value =
        currentFrame;

        slider.addEventListener("input", event => {

            currentFrame =
            parseInt(event.target.value);

            updateRadar();
        });

        startRadarAnimation();

    }catch(error){

        console.error(error);
    }
}

function startRadarAnimation(){

    updateRadar();

    setInterval(() => {

        currentFrame++;

        if(currentFrame >= radarFrames.length){

            currentFrame = 0;
        }

        document
        .getElementById("timelineSlider")
        .value = currentFrame;

        updateRadar();

    }, 800);
}

function updateRadar(){

    if(radarFrames.length === 0)
        return;

    const frame =
    radarFrames[currentFrame];

    const radarDate =
    new Date(frame.time * 1000);

    const formattedTime =
    radarDate.toLocaleTimeString(
        "de-DE",
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );

    let futureText = "";

    if(frame.fake){

        futureText =
        " • Prognose";
    }

    document
    .getElementById("timelineTime")
    .innerText =
    `🌧 Radarzeit: ${formattedTime}${futureText}`;

    const tileUrl =
    `https://tilecache.rainviewer.com${frame.path}/256/{z}/{x}/{y}/2/1_1.png`;

    if(map.getLayer(radarLayerId)){

        map.removeLayer(radarLayerId);
    }

    if(map.getSource(radarLayerId)){

        map.removeSource(radarLayerId);
    }

    map.addSource(radarLayerId, {

        type:"raster",

        tiles:[tileUrl],

        tileSize:256
    });

    map.addLayer({

        id:radarLayerId,

        type:"raster",

        source:radarLayerId,

        paint:{

            "raster-opacity":
            frame.fake ? 0.35 : 0.75
        }
    });

    /* WOLKEN LEICHT BEWEGEN */

    if(frame.fake){

        map.setPaintProperty(
            radarLayerId,
            "raster-opacity",
            0.35
        );

        map.panBy(
            [
                frame.moveX,
                frame.moveY
            ],
            {
                animate:false
            }
        );
    }
}

async function loadWeather(){

    try{

        const api =
        `https://api.open-meteo.com/v1/forecast?latitude=${ring.lat}&longitude=${ring.lon}&current=temperature_2m,wind_speed_10m&hourly=rain&daily=weather_code&forecast_hours=24&timezone=auto`;

        const response =
        await fetch(api);

        const data =
        await response.json();

        document
        .getElementById("temp")
        .innerText =
        `${Math.round(data.current.temperature_2m)}°`;

        document
        .getElementById("wind")
        .innerText =
        `${Math.round(data.current.wind_speed_10m)} km/h`;

        let arrivalText =
        "Kein Regen erwartet";

        for(let i = 0; i < data.hourly.time.length; i++){

            const rain =
            data.hourly.rain[i];

            if(rain > 0.2){

                const rainTime =
                new Date(data.hourly.time[i]);

                const formatted =
                rainTime.toLocaleTimeString(
                    "de-DE",
                    {
                        hour:"2-digit",
                        minute:"2-digit"
                    }
                );

                arrivalText =
                `🌧 Ab ${formatted}`;

                break;
            }
        }

        document
        .getElementById("arrival")
        .innerText =
        arrivalText;

        const code =
        data.daily.weather_code[0];

        let warning =
        "✅ Keine Wetterwarnung";

        if(code >= 95){

            warning =
            "⛈ Gewitter am Nürburgring möglich";
        }

        else if(code >= 61 && code <= 67){

            warning =
            "🌧 Starkregen möglich";
        }

        else if(code >= 71 && code <= 77){

            warning =
            "❄️ Schnee oder Hagel möglich";
        }

        document
        .getElementById("warning")
        .innerText =
        warning;

    }catch(error){

        console.error(error);
    }
}

map.on("load", () => {

    loadRadar();

    loadWeather();
});

setInterval(() => {

    loadWeather();

}, 60000);

</script>
