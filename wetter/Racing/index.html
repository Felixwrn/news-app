<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WRN Racing Radar</title>

<link
href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"
rel="stylesheet"
/>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

<style>

body{
    margin:0;
    background:#000;
    color:white;
    font-family:Arial,sans-serif;
    overflow:hidden;
}

#map{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
}

.overlay{

    position:absolute;

    top:20px;
    left:20px;

    z-index:10;

    width:360px;

    background:rgba(10,10,10,0.92);

    border:1px solid #1f1f1f;

    border-radius:32px;

    padding:28px;

    backdrop-filter:blur(20px);

    box-shadow:
    0 0 40px rgba(124,58,237,0.25);
}

.logo{

    color:#7c3aed;

    font-size:42px;

    font-weight:bold;

    margin-bottom:10px;
}

.subtitle{

    color:#777;

    margin-bottom:25px;

    font-size:18px;
}

.card{

    background:#111;

    border:1px solid #222;

    border-radius:24px;

    padding:22px;

    margin-bottom:18px;
}

.label{

    color:#777;

    margin-bottom:10px;

    font-size:14px;
}

.value{

    font-size:34px;

    font-weight:bold;
}

.warning{

    background:
    linear-gradient(
        90deg,
        #ff3b30,
        #ff9500
    );

    border-radius:24px;

    padding:18px;

    font-weight:bold;

    margin-top:10px;

    animation:pulse 2s infinite;
}

@keyframes pulse{

    0%{
        opacity:1;
    }

    50%{
        opacity:0.82;
    }

    100%{
        opacity:1;
    }
}

.footer{

    color:#666;

    font-size:13px;

    margin-top:20px;

    text-align:center;
}

.timeline-container{

    position:absolute;

    left:50%;
    bottom:20px;

    transform:translateX(-50%);

    z-index:10;

    width:420px;

    background:rgba(10,10,10,0.92);

    border:1px solid #1f1f1f;

    border-radius:24px;

    padding:18px 24px;

    backdrop-filter:blur(20px);

    box-shadow:
    0 0 30px rgba(124,58,237,0.2);
}

.timeline-time{

    text-align:center;

    margin-bottom:14px;

    color:white;

    font-weight:bold;

    font-size:18px;
}

.timeline-slider{

    width:100%;

    accent-color:#7c3aed;
}

.radar-badge{

    position:absolute;

    bottom:20px;
    right:20px;

    z-index:10;

    background:rgba(10,10,10,0.92);

    border:1px solid #1f1f1f;

    border-radius:24px;

    padding:16px 22px;

    backdrop-filter:blur(20px);

    color:#7c3aed;

    font-weight:bold;

    box-shadow:
    0 0 30px rgba(124,58,237,0.2);
}

</style>
</head>

<body>

<div id="map"></div>

<div class="overlay">

    <div class="logo">
        WRN Radar
    </div>

    <div class="subtitle">
        Nürburgring Racing Weather
    </div>

    <div class="card">

        <div class="label">
            🌡 Temperatur
        </div>

        <div class="value" id="temp">
            --°
        </div>

    </div>

    <div class="card">

        <div class="label">
            💨 Wind
        </div>

        <div class="value" id="wind">
            -- km/h
        </div>

    </div>

    <div class="card">

        <div class="label">
            🌧 Regenwahrscheinlichkeit
        </div>

        <div class="value" id="rain">
            --%
        </div>

    </div>

    <div class="warning" id="warning">
        Lade Wetterwarnung...
    </div>

    <div class="footer">
        WRN Weather Racing • Nürburgring Edition
    </div>

</div>

<div class="radar-badge">
    LIVE RADAR
</div>

<!-- TIMELINE -->

<div class="timeline-container">

    <div class="timeline-time" id="timelineTime">
        Lade Radarzeit...
    </div>

    <input
        type="range"
        min="0"
        max="0"
        value="0"
        id="timelineSlider"
        class="timeline-slider"
    />

</div>

<script>

const ring = {
    lat:50.3356,
    lon:6.9475
};

/* MAP */

const map = new maplibregl.Map({

    container:"map",

    style:
    "https://demotiles.maplibre.org/style.json",

    center:[ring.lon, ring.lat],

    zoom: 6
});

/* MARKER */

new maplibregl.Marker({
    color:"#7c3aed"
})
.setLngLat([
    ring.lon,
    ring.lat
])
.addTo(map);

/* RAINVIEWER RADAR */

let radarFrames = [];
let currentFrame = 0;
let radarLayerId = "radar-layer";
let radarAnimation;

async function loadRadar(){

    try{

        const response =
        await fetch(
            "https://api.rainviewer.com/public/weather-maps.json"
        );

        const data =
        await response.json();

        radarFrames = data.radar.past;

        document
        .getElementById("timelineSlider")
        .max = radarFrames.length - 1;

        startRadarAnimation();

    }catch(error){

        console.error(error);
    }
}

function startRadarAnimation(){

    if(radarFrames.length === 0)
        return;

    updateRadar();

    radarAnimation = setInterval(() => {

        currentFrame++;

        if(currentFrame >= radarFrames.length){
            currentFrame = 0;
        }

        document
        .getElementById("timelineSlider")
        .value = currentFrame;

        updateRadar();

    }, 800);
}

document
.getElementById("timelineSlider")
.addEventListener("input", event => {

    currentFrame =
    parseInt(event.target.value);

    updateRadar();
});

        updateRadar();

    }, 800);
}

function updateRadar(){

    const frame = radarFrames[currentFrame];

    const radarDate =
    new Date(frame.time * 1000);

    const formattedTime =
    radarDate.toLocaleTimeString(
        "de-DE",
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );

    document
    .getElementById("timelineTime")
    .innerText =
    `🌧 Radarzeit: ${formattedTime}`;

    const tileUrl =
    `https://tilecache.rainviewer.com${frame.path}/256/{z}/{x}/{y}/6/1_1.png`;

    if(map.getLayer(radarLayerId)){

        map.removeLayer(radarLayerId);
    }

    if(map.getSource(radarLayerId)){

        map.removeSource(radarLayerId);
    }

    map.addSource(radarLayerId, {

        type:"raster",

        tiles:[tileUrl],

        tileSize:256
    });

    map.addLayer({

        id:radarLayerId,

        type:"raster",

        source:radarLayerId,

        paint:{
            "raster-opacity":0.75
        }
    });
}

/* WEATHER */

async function loadWeather(){

    try{

        const api =
        `https://api.open-meteo.com/v1/forecast?latitude=${ring.lat}&longitude=${ring.lon}&current=temperature_2m,wind_speed_10m&hourly=precipitation_probability&daily=weather_code&timezone=auto`;

        const response =
        await fetch(api);

        const data =
        await response.json();

        document
        .getElementById("temp")
        .innerText =
        `${Math.round(data.current.temperature_2m)}°`;

        document
        .getElementById("wind")
        .innerText =
        `${Math.round(data.current.wind_speed_10m)} km/h`;

        document
        .getElementById("rain")
        .innerText =
        `${data.hourly.precipitation_probability[0]}%`;

        const code =
        data.daily.weather_code[0];

        let warning =
        "✅ Keine Wetterwarnung";

        if(code >= 95){

            warning =
            "⛈ Gewitter am Nürburgring möglich";
        }

        else if(code >= 61 && code <= 67){

            warning =
            "🌧 Starkregen möglich";
        }

        else if(code >= 71 && code <= 77){

            warning =
            "❄️ Schnee oder Hagel möglich";
        }

        document
        .getElementById("warning")
        .innerText =
        warning;

    }catch(error){

        console.error(error);
    }
}

map.on("load", () => {

    loadRadar();

    loadWeather();
});

setInterval(() => {

    loadWeather();

}, 600000);

</script>

</body>
</html>
