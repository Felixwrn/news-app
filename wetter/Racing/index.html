<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WRN Racing Radar</title>

<link
href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"
rel="stylesheet"
/>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

<style>

body{
    margin:0;
    background:#000;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

#map{
    position:absolute;
    inset:0;
}

.overlay{

    position:absolute;

    top:20px;
    left:20px;

    z-index:10;

    width:340px;

    background:rgba(10,10,10,0.92);

    border-radius:30px;

    padding:24px;

    color:white;

    backdrop-filter:blur(20px);

    border:1px solid #222;
}

.logo{

    font-size:42px;

    font-weight:bold;

    color:#7c3aed;

    margin-bottom:10px;
}

.subtitle{

    color:#777;

    margin-bottom:20px;
}

.card{

    background:#111;

    border-radius:22px;

    padding:20px;

    margin-bottom:16px;

    border:1px solid #222;
}

.label{

    color:#777;

    margin-bottom:8px;
}

.value{

    font-size:34px;

    font-weight:bold;
}

.warning{

    margin-top:10px;

    padding:18px;

    border-radius:20px;

    background:
    linear-gradient(
        90deg,
        #ff3b30,
        #ff9500
    );

    font-weight:bold;
}

.timeline{

    position:absolute;

    right:20px;
    bottom:20px;

    z-index:10;

    width:420px;

    background:rgba(10,10,10,0.92);

    padding:20px;

    border-radius:24px;

    backdrop-filter:blur(20px);

    border:1px solid #222;
}

.timeline-time{

    color:white;

    text-align:center;

    margin-bottom:12px;

    font-weight:bold;
}

.slider{

    width:100%;

    accent-color:#7c3aed;
}

</style>
</head>

<body>

<div id="map"></div>

<div class="overlay">

    <div class="logo">
        WRN Radar
    </div>

    <div class="subtitle">
        Nürburgring Racing Weather
    </div>

    <div class="card">

        <div class="label">
            🌡 Temperatur
        </div>

        <div class="value" id="temp">
            --°
        </div>

    </div>

    <div class="card">

        <div class="label">
            💨 Wind
        </div>

        <div class="value" id="wind">
            -- km/h
        </div>

    </div>

    <div class="warning" id="warning">
        Lade Wetter...
    </div>

</div>

<div class="timeline">

    <div class="timeline-time" id="timelineTime">
        Lade Radar...
    </div>

    <input
        type="range"
        class="slider"
        id="slider"
        min="0"
        max="0"
        value="0"
    />

</div>

<script>

const ring = {

    lat:50.3351,
    lon:6.9474
};

const map = new maplibregl.Map({

    container:"map",

    style:{
        version:8,

        sources:{
            osm:{
                type:"raster",

                tiles:[

                    "https://a.tile.openstreetmap.org/{z}/{x}/{y}.png",
                    "https://b.tile.openstreetmap.org/{z}/{x}/{y}.png",
                    "https://c.tile.openstreetmap.org/{z}/{x}/{y}.png"
                ],

                tileSize:256
            }
        },

        layers:[
            {
                id:"osm",
                type:"raster",
                source:"osm"
            }
        ]
    },

    center:[
        ring.lon,
        ring.lat
    ],

    zoom:4,

    minZoom:3,

    maxZoom:5
});

new maplibregl.Marker({

    color:"#7c3aed"

})
.setLngLat([

    ring.lon,
    ring.lat

])
.addTo(map);

let frames = [];
let current = 0;

async function loadRadar(){

    const response =
    await fetch(
        "https://api.rainviewer.com/public/weather-maps.json"
    );

    const data =
    await response.json();

    frames = [

        ...data.radar.past,

        ...(data.radar.nowcast || [])
    ];

    const last =
    frames[
        frames.length - 1
    ];

    /* 3H FAKE FUTURE */

    for(let i = 1; i <= 36; i++){

        frames.push({

            path:last.path,

            time:last.time + (i * 300),

            fake:true
        });
    }

    const slider =
    document.getElementById("slider");

    slider.max =
    frames.length - 1;

    current =
    frames.length - 40;

    slider.value =
    current;

    slider.addEventListener(
        "input",
        e => {

            current =
            parseInt(
                e.target.value
            );

            updateRadar();
        }
    );

    updateRadar();

    setInterval(() => {

        current++;

        if(current >= frames.length){

            current = 0;
        }

        slider.value =
        current;

        updateRadar();

    }, 800);
}

function updateRadar(){

    const frame =
    frames[current];

    if(!frame)
        return;

    if(map.getLayer("radar")){

        map.removeLayer("radar");
    }

    if(map.getSource("radar")){

        map.removeSource("radar");
    }

    const time =
    new Date(
        frame.time * 1000
    );

    const formatted =
    time.toLocaleTimeString(
        "de-DE",
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );

    document
    .getElementById("timelineTime")
    .innerText =
    frame.fake
    ?
    `🌧 ${formatted} • Prognose`
    :
    `🌧 ${formatted}`;

    map.addSource("radar", {

        type:"raster",

        tiles:[

            `https://tilecache.rainviewer.com${frame.path}/256/{z}/{x}/{y}/2/1_1.png`
        ],

        tileSize:256
    });

    map.addLayer({

        id:"radar",

        type:"raster",

        source:"radar",

        paint:{

            "raster-opacity":
            frame.fake
            ?
            0.35 + Math.sin(current * 0.5) * 0.1
            :
            0.75
        }
    });
}

async function loadWeather(){

    const response =
    await fetch(

        `https://api.open-meteo.com/v1/forecast?latitude=${ring.lat}&longitude=${ring.lon}&current=temperature_2m,wind_speed_10m&daily=weather_code&timezone=auto`
    );

    const data =
    await response.json();

    document
    .getElementById("temp")
    .innerText =
    `${Math.round(
        data.current.temperature_2m
    )}°`;

    document
    .getElementById("wind")
    .innerText =
    `${Math.round(
        data.current.wind_speed_10m
    )} km/h`;

    let warning =
    "✅ Keine Wetterwarnung";

    const code =
    data.daily.weather_code[0];

    if(code >= 95){

        warning =
        "⛈ Gewitter möglich";
    }

    else if(
        code >= 61 &&
        code <= 67
    ){

        warning =
        "🌧 Starkregen möglich";
    }

    document
    .getElementById("warning")
    .innerText =
    warning;
}

map.on("load", () => {

    loadRadar();

    loadWeather();
});

setInterval(() => {

    loadWeather();

}, 60000);

</script>

</body>
</html>
