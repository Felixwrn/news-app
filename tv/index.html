<!DOCTYPE html>
<html lang="de">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WRN News TV</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000000;
    color:white;
    font-family:Arial,sans-serif;
    overflow:hidden;
}

/* HEADER */

.header{
    height:90px;
    padding:0 40px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid #1a1a1a;
    background:#050505;
}

.logo{
    display:flex;
    align-items:center;
    gap:16px;
}

.dot{
    width:14px;
    height:14px;
    border-radius:50%;
    background:#7c3aed;
    box-shadow:0 0 20px #7c3aed;
}

.logo h1{
    font-size:42px;
    color:#7c3aed;
    letter-spacing:2px;
}

.clock{
    text-align:right;
}

.clock h2{
    font-size:32px;
}

.clock p{
    color:#777;
    margin-top:4px;
}

/* LAYOUT */

.layout{
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:30px;
    padding:30px;
    height:calc(100vh - 90px);
}

/* HERO */

.hero{
    background:
    linear-gradient(
        to bottom right,
        rgba(124,58,237,0.25),
        #050505
    );

    border:1px solid #1f1f1f;
    border-radius:36px;

    padding:50px;

    display:flex;
    flex-direction:column;
    justify-content:flex-end;
}

.breaking{
    display:inline-block;

    background:#7c3aed;

    padding:12px 22px;

    border-radius:999px;

    font-size:18px;
    font-weight:bold;

    margin-bottom:28px;
}

.hero h2{
    font-size:64px;
    line-height:1.15;
    max-width:1100px;
}

.hero p{
    margin-top:24px;
    font-size:24px;
    color:#aaaaaa;
    max-width:850px;
    line-height:1.5;
}

/* SIDEBAR */

.sidebar{
    background:#0a0a0a;

    border:1px solid #1f1f1f;

    border-radius:36px;

    padding:30px;

    display:flex;
    flex-direction:column;

    overflow:hidden;
}

.sidebar h3{
    font-size:34px;
    margin-bottom:24px;
}

/* NEWS */

.news-list{
    display:flex;
    flex-direction:column;
    gap:20px;
    overflow-y:auto;
}

.news-card{
    background:#111111;

    border:1px solid #222222;

    border-radius:24px;

    padding:22px;

    transition:0.3s;
}

.news-card:hover{
    border-color:#7c3aed;
}

.category{
    color:#7c3aed;

    font-size:13px;

    letter-spacing:1px;

    margin-bottom:10px;

    font-weight:bold;
}

.headline{
    font-size:24px;
    line-height:1.4;
}

/* FOOTER */

.footer{
    margin-top:auto;

    padding-top:20px;

    border-top:1px solid #1f1f1f;

    color:#666666;

    font-size:14px;
}

</style>
</head>

<body>

<!-- HEADER -->

<div class="header">

    <div class="logo">
        <div class="dot"></div>
        <h1>WRN News TV</h1>
    </div>

    <div class="clock">
        <h2 id="clock">20:15</h2>
        <p>LIVE MODE</p>
    </div>

</div>

<!-- MAIN -->

<div class="layout">

    <!-- LEFT -->

    <div class="hero">

        <div class="breaking">
            BREAKING NEWS
        </div>

        <h2 id="mainHeadline">
            Loading latest headlines...
        </h2>

        <p>
            Futuristic television news experience powered by WRN.
        </p>

    </div>

    <!-- RIGHT -->

    <div class="sidebar">

        <h3>Live Headlines</h3>

        <div class="news-list" id="newsList"></div>

        <div class="footer">
            WRNlabs Television News Platform
        </div>

    </div>

</div>

<script>

/* CLOCK */

function updateClock(){

    const now = new Date();

    const time =
    now.toLocaleTimeString(
        "de-DE",
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );

    document
    .getElementById("clock")
    .innerText = time;
}

updateClock();

setInterval(updateClock,1000);

/* RSS */

const rssUrl =
"https://www.tagesschau.de/index~rss2.xml";

const apiUrl =
`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;

async function loadNews(){

    try{

        const response =
        await fetch(apiUrl);

        const data =
        await response.json();

        const newsList =
        document.getElementById("newsList");

        newsList.innerHTML = "";

        /* MAIN HEADLINE */

        if(data.items.length > 0){

            document
            .getElementById("mainHeadline")
            .innerText =
            data.items[0].title;
        }

        /* SIDEBAR */

        data.items
        .slice(0,8)
        .forEach(article => {

            const card =
            document.createElement("div");

            card.className =
            "news-card";

            card.innerHTML = `

                <div class="category">
                    NEWS
                </div>

                <div class="headline">
                    ${article.title}
                </div>

            `;

            newsList.appendChild(card);

        });

    }catch(error){

        console.error(error);

        document
        .getElementById("mainHeadline")
        .innerText =
        "Failed to load RSS feed.";

    }

}

loadNews();

/* AUTO REFRESH */

setInterval(loadNews,300000);

</script>

</body>
</html>
