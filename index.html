<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WRNlabs News</title>

<style>

body{
    margin:0;
    background:#000;
    color:white;
    font-family:Arial,sans-serif;
}

.header{
    padding:30px;
    border-bottom:1px solid #222;
}

.header h1{
    margin:0;
    color:#7c3aed;
    font-size:42px;
}

.header p{
    color:#888;
    margin-top:10px;
}

.news-container{
    padding:20px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:20px;
}

.card{
    background:#111;
    border:1px solid #222;
    border-radius:24px;
    overflow:hidden;
    transition:0.3s;
}

.card:hover{
    border-color:#7c3aed;
    transform:translateY(-5px);
}

.card img{
    width:100%;
    height:200px;
    object-fit:cover;
}

.card-content{
    padding:20px;
}

.card h2{
    font-size:24px;
    margin-top:0;
}

.card p{
    color:#aaa;
    line-height:1.5;
}

.source{
    color:#7c3aed;
    margin-bottom:15px;
    display:block;
}

.btn{
    display:inline-block;
    margin-top:15px;
    padding:12px 24px;
    background:#7c3aed;
    color:white;
    text-decoration:none;
    border-radius:16px;
}

.loading{
    text-align:center;
    padding:60px;
    color:#777;
    font-size:22px;
}

</style>
</head>

<body>

<div class="header">
    <h1>WRNlabs News</h1>
    <p>Global live news feed powered by NewsAPI</p>
</div>

<div class="loading" id="loading">
    Loading latest news...
</div>

<div class="news-container" id="newsContainer"></div>

<script>

const apiKey = "36ec972c358a4e279d19145c7752f8ef";

fetch(`https://newsapi.org/v2/top-headlines?country=us&pageSize=12&apiKey=${apiKey}`)
.then(response => response.json())
.then(data => {

    document.getElementById("loading").style.display = "none";

    const container = document.getElementById("newsContainer");

    data.articles.forEach(article => {

        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `

        <img src="${article.urlToImage || 'https://via.placeholder.com/400x200?text=WRNlabs'}">

        <div class="card-content">

            <span class="source">${article.source.name}</span>

            <h2>${article.title}</h2>

            <p>${article.description || 'No description available.'}</p>

            <a class="btn" href="${article.url}" target="_blank">
                Read Article
            </a>

        </div>

        `;

        container.appendChild(card);

    });

})
.catch(error => {

    document.getElementById("loading").innerHTML =
    "Failed to load news feed.";

    console.error(error);

});

</script>

</body>
</html>
