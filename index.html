<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WRNlabs News</title>

<style>

body{
    margin:0;
    background:#000;
    color:white;
    font-family:Arial,sans-serif;
}

.header{
    padding:30px;
    border-bottom:1px solid #222;
}

.header h1{
    margin:0;
    color:#7c3aed;
    font-size:42px;
}

.header p{
    color:#888;
    margin-top:10px;
}

.news-container{
    padding:20px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:20px;
}

.card{
    background:#111;
    border:1px solid #222;
    border-radius:24px;
    overflow:hidden;
    transition:0.3s;
}

.card:hover{
    border-color:#7c3aed;
    transform:translateY(-5px);
}

.card img{
    width:100%;
    height:200px;
    object-fit:cover;
}

.card-content{
    padding:20px;
}

.card h2{
    font-size:24px;
    margin-top:0;
}

.card p{
    color:#aaa;
    line-height:1.5;
}

.source{
    color:#7c3aed;
    margin-bottom:15px;
    display:block;
}

.btn{
    display:inline-block;
    margin-top:15px;
    padding:12px 24px;
    background:#7c3aed;
    color:white;
    text-decoration:none;
</html>
